openapi: 3.1.0
info:
  title: LUMORA Agent API
  version: 1.1.0
  description: |
    Java Local Core 与本机 Python Agent 之间的 REST/JSON 契约。
    模型连接参数仅由 Java 在已认证的本机请求中临时传入，Python 不持久化。
servers:
  - url: http://127.0.0.1:45101
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getAgentHealth
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Agent 已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tasks/plan:
    post:
      operationId: planTask
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanTaskRequest"
      responses:
        "200":
          description: 任务规划成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/chat/completions:
    post:
      operationId: completeChat
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 模型响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
        "502":
          description: 上游模型调用失败
  /api/v1/chat/completions/stream:
    post:
      operationId: streamChatCompletion
      description: 以 SSE 返回推理增量、文本增量、用量和结束状态。
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 模型增量响应
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProtocolVersion:
      name: X-Lumora-Protocol-Version
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: 请求内容或关联 ID 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 本机启动令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProtocolMismatch:
      description: 协议版本不兼容
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Agent 内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, protocolVersion]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: lumora-agent
        protocolVersion:
          type: string
    PlanTaskRequest:
      type: object
      additionalProperties: false
      required: [taskId, goal]
      properties:
        taskId:
          type: string
          minLength: 1
        goal:
          type: string
          minLength: 1
    PlanTaskResponse:
      type: object
      additionalProperties: false
      required: [taskId, steps]
      properties:
        taskId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStepResponse"
    PlanStepResponse:
      type: object
      additionalProperties: false
      required: [stepId, title, description, requiresApproval]
      properties:
        stepId:
          type: string
        title:
          type: string
        description:
          type: string
        requiresApproval:
          type: boolean
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [messages, connection]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChatMessage"
        connection:
          $ref: "#/components/schemas/ModelConnection"
    ModelConnection:
      type: object
      additionalProperties: false
      required: [providerName, baseUrl, model, apiKey]
      properties:
        providerName:
          type: string
          minLength: 1
          maxLength: 80
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
        model:
          type: string
          minLength: 1
          maxLength: 160
        apiKey:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: 仅在本机 Java 到 Python 的当前请求内使用，不落盘。
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [message, model, usage]
      properties:
        message:
          type: string
        model:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
    ChatStreamEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text_delta, reasoning_delta, usage, completed, failed]
        delta:
          type: string
        model:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
        errorMessage:
          type: string
    TokenUsage:
      type: object
      additionalProperties: false
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, retryable, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        correlationId:
          type: string
