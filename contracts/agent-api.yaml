openapi: 3.1.0
info:
  title: LUMORA Agent API
  version: 1.1.0
  description: |
    Java Local Core 与本机 Python Agent 之间的 REST/JSON 契约。
    模型连接参数仅由 Java 在已认证的本机请求中临时传入，Python 不持久化。
servers:
  - url: http://127.0.0.1:45101
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getAgentHealth
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Agent 已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tasks/plan:
    post:
      operationId: planTask
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanTaskRequest"
      responses:
        "200":
          description: 任务规划成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/chat/completions:
    post:
      operationId: completeChat
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 模型响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
        "502":
          description: 上游模型调用失败
  /api/v1/chat/completions/stream:
    post:
      operationId: streamChatCompletion
      description: 以 SSE 返回推理增量、文本增量、用量和结束状态。
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 模型增量响应
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/ProtocolMismatch"
  /api/v1/chat/compact:
    post:
      operationId: compactChatContext
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 会话上下文摘要及覆盖边界
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextCompactionResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "412": { $ref: "#/components/responses/ProtocolMismatch" }
  /api/v1/artifacts/read:
    post:
      operationId: readArtifact
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactReadRequest" }
      responses:
        "200":
          description: 有界 Artifact 文本块
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactReadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/artifacts/search:
    post:
      operationId: searchArtifact
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactSearchRequest" }
      responses:
        "200":
          description: 有界 Artifact 搜索结果
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/memory/extractions:
    post:
      operationId: extractMemories
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryExtractionRequest" }
      responses:
        "200":
          description: 经过筛选的结构化记忆候选
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryExtractionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: 上游模型调用失败 }
  /api/v1/mcp/test:
    post:
      operationId: testMcpServer
      description: 对远程 Streamable HTTP MCP Server 执行初始化、能力发现和可选 echo 测试。
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServer" }
      responses:
        "200":
          description: MCP Server 连接与工具发现成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpTestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: MCP Server 连接或协议调用失败 }
  /api/v1/tool-approvals/{approvalId}:
    post:
      operationId: decideToolApproval
      description: 恢复一个由权限系统暂停的 Agent Loop。
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolApprovalDecision"
      responses:
        "204": { description: 审批决定已接收 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: 审批不存在、已处理或不属于当前会话 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProtocolVersion:
      name: X-Lumora-Protocol-Version
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: 请求内容或关联 ID 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 本机启动令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProtocolMismatch:
      description: 协议版本不兼容
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Agent 内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, protocolVersion]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: lumora-agent
        protocolVersion:
          type: string
    PlanTaskRequest:
      type: object
      additionalProperties: false
      required: [taskId, goal]
      properties:
        taskId:
          type: string
          minLength: 1
        goal:
          type: string
          minLength: 1
    PlanTaskResponse:
      type: object
      additionalProperties: false
      required: [taskId, steps]
      properties:
        taskId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStepResponse"
    PlanStepResponse:
      type: object
      additionalProperties: false
      required: [stepId, title, description, requiresApproval]
      properties:
        stepId:
          type: string
        title:
          type: string
        description:
          type: string
        requiresApproval:
          type: boolean
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [messages, connection]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChatMessage"
        connection:
          $ref: "#/components/schemas/ModelConnection"
        promptContext:
          $ref: "#/components/schemas/PromptContext"
        reasoningEffort:
          type: string
          enum: [none, low, high, max]
    PromptContext:
      type: object
      additionalProperties: false
      properties:
        workspacePath:
          type: string
          maxLength: 1000
        projectInstructions:
          type: array
          items: { type: string }
        availableTools:
          type: array
          items: { type: string }
          description: 工作区存在且列表为空时采用 Python ToolRegistry 的默认工具集；非空时仅用于收窄。
        memorySummary:
          type: string
        memoryCandidates:
          type: array
          maxItems: 60
          items:
            $ref: "#/components/schemas/MemoryContext"
        taskId:
          type: string
          maxLength: 160
        conversationSummary:
          type: string
          maxLength: 100000
        permissionMode:
          type: string
          enum: [full_access, auto_approve, request_approval]
          default: request_approval
        permissionRules:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PermissionRule"
        mcpServers:
          type: array
          maxItems: 20
          description: 当前请求可使用的远程 Streamable HTTP MCP Server；Python 不持久化。
          items:
            $ref: "#/components/schemas/McpServer"
    McpServer:
      type: object
      additionalProperties: false
      required: [serverId, name, url]
      properties:
        serverId:
          type: string
          pattern: '^[A-Za-z0-9._-]+$'
          maxLength: 80
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean, default: true }
        url:
          type: string
          maxLength: 2000
          pattern: '^https?://'
        authType:
          type: string
          enum: [none, bearer, api_key, custom_header]
          default: none
        headerName:
          type: string
          maxLength: 100
          pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
        credential:
          type: string
          maxLength: 4096
          writeOnly: true
    McpTestResponse:
      type: object
      additionalProperties: false
      required: [connected, serverName, serverVersion, tools, resources, resourceTemplates, prompts]
      properties:
        connected: { type: boolean }
        serverName: { type: string }
        serverVersion: { type: string }
        tools:
          type: array
          items: { type: string }
        resources:
          type: array
          items: { type: string }
        resourceTemplates:
          type: array
          items: { type: string }
        prompts:
          type: array
          items: { type: string }
        echoOutput: { type: string }
    PermissionRule:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        tool: { type: string, minLength: 1, maxLength: 100 }
        pattern: { type: string, minLength: 1, maxLength: 20000, default: "*" }
        decision:
          type: string
          enum: [allow, deny, ask]
          default: ask
    MemoryContext:
      type: object
      additionalProperties: false
      required: [memoryId, scope, type, content, updatedTime]
      properties:
        memoryId: { type: string, minLength: 1, maxLength: 100 }
        scope:
          type: string
          enum: [USER, PROJECT, CONVERSATION]
        type:
          type: string
          enum: [PREFERENCE, FACT, DECISION, CONSTRAINT, SUMMARY]
        content: { type: string, minLength: 1, maxLength: 4000 }
        importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        confidence: { type: number, minimum: 0, maximum: 1, default: 1 }
        usageCount: { type: integer, minimum: 0, default: 0 }
        lastUsedTime: { type: string, format: date-time }
        updatedTime: { type: string, format: date-time }
    MemoryExtractionRequest:
      type: object
      additionalProperties: false
      required: [userMessage, assistantMessage, connection]
      properties:
        userMessage: { type: string, minLength: 1, maxLength: 20000 }
        assistantMessage: { type: string, minLength: 1, maxLength: 100000 }
        existingMemorySummary: { type: string, maxLength: 20000 }
        workspacePath: { type: string, maxLength: 1000 }
        connection: { $ref: "#/components/schemas/ModelConnection" }
    MemoryExtractionResponse:
      type: object
      additionalProperties: false
      required: [candidates, model, usage]
      properties:
        candidates:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/MemoryCandidate" }
        model:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
    MemoryCandidate:
      type: object
      additionalProperties: false
      required:
        - action
        - storage
        - scope
        - type
        - retention
        - content
        - dedupeKey
        - subject
        - predicate
        - value
        - confidence
      properties:
        action:
          type: string
          enum: [UPSERT, ARCHIVE]
          default: UPSERT
        storage:
          type: string
          enum: [MEMORY, PROJECT_INSTRUCTIONS]
          default: MEMORY
        scope:
          type: string
          enum: [USER, PROJECT, CONVERSATION]
        type:
          type: string
          enum: [PREFERENCE, FACT, DECISION, CONSTRAINT, SUMMARY]
        retention:
          type: string
          enum: [SHORT_TERM, LONG_TERM]
        content: { type: string, minLength: 1, maxLength: 4000 }
        dedupeKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]*$'
          maxLength: 240
        subject: { type: string, minLength: 1, maxLength: 500 }
        predicate: { type: string, minLength: 1, maxLength: 240 }
        value: { type: string, minLength: 1, maxLength: 2000 }
        targetMemoryId: { type: string, maxLength: 100 }
        structuredData: { type: object, additionalProperties: true }
        confidence: { type: number, minimum: 0, maximum: 1 }
        importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        ttlSeconds: { type: integer, minimum: 60, maximum: 2592000 }
    ToolApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, allow_once, allow_always, deny]
    ModelConnection:
      type: object
      additionalProperties: false
      required: [providerName, baseUrl, model, apiKey]
      properties:
        providerName:
          type: string
          minLength: 1
          maxLength: 80
        baseUrl:
          type: string
          minLength: 1
          maxLength: 500
        model:
          type: string
          minLength: 1
          maxLength: 160
        apiKey:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: 仅在本机 Java 到 Python 的当前请求内使用，不落盘。
        apiFormat:
          type: string
          enum: [anthropic, chat-completions, responses]
          default: chat-completions
        webSearchEnabled:
          type: boolean
          default: false
          description: 是否允许当前模型使用供应商托管的 Web Search 工具。
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 10000000
          description: 当前模型配置的最大输出 Token；未配置时省略。
        contextWindow:
          type: integer
          minimum: 1
          maximum: 10000000
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        messageId:
          type: string
        sequence:
          type: integer
          minimum: 1
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [message, model, usage]
      properties:
        message:
          type: string
        model:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
    ChatStreamEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum:
            - text_delta
            - text_reset
            - reasoning_delta
            - progress_message
            - context_compaction_started
            - context_compaction_progress
            - context_compacted
            - context_compaction_failed
            - web_search_started
            - web_search_progress
            - web_search_completed
            - web_search_failed
            - tool_started
            - tool_completed
            - tool_failed
            - tool_approval_requested
            - tool_approval_resolved
            - approval_review_started
            - approval_review_completed
            - usage
            - completed
            - failed
        delta:
          type: string
        model:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
        activeContextTokens:
          type: integer
          minimum: 0
          description: 当前最后一次模型请求实际占用的上下文 Token，不属于计费用量累计值。
        errorMessage:
          type: string
        itemId:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        title:
          type: string
        arguments:
          type: object
          additionalProperties: true
        output:
          type: string
        durationMs:
          type: integer
          minimum: 0
        exitCode:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        approvalId:
          type: string
        permissionLayer:
          type: string
        reason:
          type: string
        riskLevel:
          type: string
        reversible:
          type: boolean
        decision:
          type: string
          enum: [allow, deny, ""]
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - promptTokens
        - completionTokens
        - totalTokens
        - inputTokens
        - outputTokens
        - reasoningTokens
        - cacheReadTokens
        - cacheWriteTokens
        - cacheMetricsAvailable
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        reasoningTokens:
          type: integer
          minimum: 0
        cacheReadTokens:
          type: integer
          minimum: 0
        cacheWriteTokens:
          type: integer
          minimum: 0
        cacheMetricsAvailable:
          type: boolean
    ContextCompactionResponse:
      type: object
      additionalProperties: false
      required: [summary, beforeTokens, afterTokens, usage]
      properties:
        summary: { type: string }
        beforeTokens: { type: integer, minimum: 0 }
        afterTokens: { type: integer, minimum: 0 }
        throughSequence: { type: integer, minimum: 1 }
        retainedFromSequence: { type: integer, minimum: 1 }
        usage: { $ref: "#/components/schemas/TokenUsage" }
    ArtifactReadRequest:
      type: object
      additionalProperties: false
      required: [taskId, artifactId]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 160 }
        artifactId: { type: string, pattern: '^art_[0-9a-f]{32}$' }
        offset: { type: integer, minimum: 0, default: 0 }
        limit: { type: integer, minimum: 1, maximum: 40000, default: 20000 }
    ArtifactSearchRequest:
      type: object
      additionalProperties: false
      required: [taskId, artifactId, query]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 160 }
        artifactId: { type: string, pattern: '^art_[0-9a-f]{32}$' }
        query: { type: string, minLength: 1, maxLength: 500 }
        maxResults: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ArtifactReadResponse:
      type: object
      additionalProperties: false
      required: [artifactId, content, offset, hasMore, characterCount]
      properties:
        artifactId: { type: string }
        content: { type: string }
        offset: { type: integer, minimum: 0 }
        nextOffset: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        characterCount: { type: integer, minimum: 0 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, retryable, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        correlationId:
          type: string
