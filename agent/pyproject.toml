[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lumora-agent"
version = "0.1.0"
description = "LUMORA local Agent planning and orchestration runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio>=1.74,<2",
  "protobuf>=6.31,<7",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.74,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lumora_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "generated"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "generated"]

