spring:
  application:
    name: lumora-local-core
  datasource:
    url: jdbc:sqlite:${LUMORA_DATABASE_PATH:./runtime/lumora.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 的外键开关属于连接状态，每个池连接都必须初始化。
      connection-init-sql: PRAGMA foreign_keys=ON
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  address: 127.0.0.1
  port: ${LUMORA_CORE_PORT:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

lumora:
  protocol-version: ${LUMORA_PROTOCOL_VERSION:1}
  startup-token: ${LUMORA_STARTUP_TOKEN:}
  agent-url: ${LUMORA_AGENT_URL:http://127.0.0.1:45101}
  agent-startup-token: ${LUMORA_AGENT_STARTUP_TOKEN:${LUMORA_STARTUP_TOKEN:}}
  memory-auto-extraction-enabled: ${LUMORA_MEMORY_AUTO_EXTRACTION_ENABLED:true}
