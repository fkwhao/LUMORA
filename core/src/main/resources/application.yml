spring:
  application:
    name: lumora-local-core
  datasource:
    url: jdbc:sqlite:${LUMORA_DATABASE_PATH:./runtime/lumora.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 同时只允许一个写事务。任务仍可并发执行，但短数据库提交
      # 通过单连接池排队，避免不同持久化服务互相触发 SQLITE_BUSY。
      maximum-pool-size: 1
      minimum-idle: 1
      # SQLite 的外键开关属于连接状态，每个池连接都必须初始化。
      connection-init-sql: PRAGMA foreign_keys=ON
      data-source-properties:
        # 外部短暂占锁时等待释放，不把瞬时竞争直接升级为任务失败。
        busy_timeout: 10000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  address: 127.0.0.1
  port: ${LUMORA_CORE_PORT:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

lumora:
  protocol-version: ${LUMORA_PROTOCOL_VERSION:1}
  startup-token: ${LUMORA_STARTUP_TOKEN:}
  agent-url: ${LUMORA_AGENT_URL:http://127.0.0.1:45101}
  agent-startup-token: ${LUMORA_AGENT_STARTUP_TOKEN:${LUMORA_STARTUP_TOKEN:}}
  memory-auto-extraction-enabled: ${LUMORA_MEMORY_AUTO_EXTRACTION_ENABLED:true}
  runs:
    # 不同任务可并发；同一任务仍由其持久问题队列严格串行。
    max-concurrent: ${LUMORA_MAX_CONCURRENT_RUNS:3}
    # 高频 Run 事件保留独立序号，但在很短窗口内合并 SQLite 事务。
    event-flush-interval-ms: ${LUMORA_RUN_EVENT_FLUSH_INTERVAL_MS:20}
  worktrees:
    # 空值时使用系统临时目录下的 lumora-worktrees。
    root: ${LUMORA_WORKTREE_ROOT:}
    # 包含待审阅、冲突和已转正式分支但仍占用目录的 Worktree。
    max-retained: ${LUMORA_MAX_RETAINED_WORKTREES:5}
    cleanup-retry-ms: ${LUMORA_WORKTREE_CLEANUP_RETRY_MS:30000}
