syntax = "proto3";

package lumora.v1;

import "google/protobuf/timestamp.proto";
import "lumora/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.lumora.protocol.v1";

// Java Core 持久化的任务状态，其他运行时只消费，不自行扩展状态值。
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_CREATED = 1;
  TASK_STATUS_PLANNING = 2;
  TASK_STATUS_RUNNING = 3;
  TASK_STATUS_WAITING_APPROVAL = 4;
  TASK_STATUS_COMPLETED = 5;
  TASK_STATUS_REJECTED = 6;
  TASK_STATUS_INTERRUPTED = 7;
  TASK_STATUS_FAILED = 8;
}

enum TaskEventType {
  TASK_EVENT_TYPE_UNSPECIFIED = 0;
  TASK_EVENT_TYPE_TASK_CREATED = 1;
  TASK_EVENT_TYPE_STATUS_CHANGED = 2;
  TASK_EVENT_TYPE_PLAN_STEP_STARTED = 3;
  TASK_EVENT_TYPE_PLAN_STEP_COMPLETED = 4;
  TASK_EVENT_TYPE_APPROVAL_REQUESTED = 5;
  TASK_EVENT_TYPE_APPROVAL_DECIDED = 6;
  TASK_EVENT_TYPE_RESULT_AVAILABLE = 7;
  TASK_EVENT_TYPE_TASK_ERROR = 8;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_ALLOW_ONCE = 1;
  APPROVAL_DECISION_REJECT = 2;
}

message TaskSnapshot {
  string task_id = 1;
  string goal = 2;
  TaskStatus status = 3;
  uint64 last_event_sequence = 4;
  string active_step = 5;
  string result_summary = 6;
  ErrorDetail error = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ApprovalRequest {
  string approval_id = 1;
  string task_id = 2;
  string action = 3;
  string impact_summary = 4;
  string risk_level = 5;
  bool reversible = 6;
  google.protobuf.Timestamp created_at = 7;
}

// sequence 在单个任务内严格递增，客户端据此去重并在断线后继续订阅。
message TaskEvent {
  string task_id = 1;
  uint64 sequence = 2;
  TaskEventType type = 3;
  TaskStatus status = 4;
  string title = 5;
  string user_message = 6;
  ApprovalRequest approval = 7;
  ErrorDetail error = 8;
  google.protobuf.Timestamp occurred_at = 9;
}
