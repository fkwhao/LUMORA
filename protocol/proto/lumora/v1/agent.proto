syntax = "proto3";

package lumora.v1;

import "lumora/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.lumora.protocol.v1";

message PlanStep {
  string step_id = 1;
  string title = 2;
  string description = 3;
  bool requires_approval = 4;
}

message PlanTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
  string goal = 3;
}

message PlanTaskResponse {
  string task_id = 1;
  repeated PlanStep steps = 2;
}

service AgentService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc PlanTask(PlanTaskRequest) returns (PlanTaskResponse);
}

